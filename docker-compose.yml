name: weather-app

x-backend-env: &backend-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-weather_app}
  DB_USERNAME: ${DB_USERNAME:-weather}
  DB_PASSWORD: ${DB_PASSWORD:-weather}
  # Poczta: Mailpit (podgląd wiadomości w przeglądarce)
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  # Język komunikatów backendu (walidacja, maile)
  APP_LOCALE: pl
  # Adres frontendu: CORS oraz linki w mailach (reset hasła, weryfikacja e-maila)
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-weather_app}
      MYSQL_USER: ${DB_USERNAME:-weather}
      MYSQL_PASSWORD: ${DB_PASSWORD:-weather}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Uruchamia harmonogram Laravela (weather:update, air:update, alerts:forecast)
  scheduler:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    environment:
      <<: *backend-env
      CONTAINER_ROLE: scheduler
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_healthy

  # Przetwarza zadania z kolejki (QUEUE_CONNECTION=database): maile, powiadomienia push
  queue:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    environment:
      <<: *backend-env
      CONTAINER_ROLE: queue
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Testowy serwer SMTP - wysłane maile widać w przeglądarce
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  backend-vendor:
  frontend-node-modules:
